# HomeDir 部署速查
#
#   改完代码后重新构建并启动（最常用，首次部署也用它）：
#     docker compose up -d --build
#
#   构建没吃到改动 / 缓存出问题时，强制不用缓存完整重建：
#     docker compose build --no-cache
#     docker compose up -d
#
#   重建后清理被替换下来的悬空旧镜像（可选，回收磁盘）：
#     docker image prune -f
#
#   只看这次构建过程（构建失败时排查用，不加 -d 保持前台输出）：
#     docker compose up --build
#
#   仅启动（不重新构建）：
#     docker compose up -d
#
#   查看运行状态与日志：
#     docker compose ps
#     docker compose logs -f
#
#   重启 / 停止 / 停止并删除容器（数据保留在 ./data）：
#     docker compose restart
#     docker compose stop
#     docker compose down
#
#   备份数据（含 SQLite 库与上传的图标）：
#     cp -r data data.bak
#
# 访问地址：http://<服务器IP>:4027   后台：http://<服务器IP>:4027/admin

services:
  homedir:
    # 从本地源码构建（含自定义改动）；如需回退官方镜像，改回 image: 52lxcloud/homedir:latest
    build:
      context: .
    image: homedir:local
    container_name: homedir-zhuijume
    restart: unless-stopped
    environment:
      # 上海时区（需镜像内含 tzdata，见 Dockerfile）
      TZ: Asia/Shanghai
    ports:
      - "4027:4027"
    volumes:
      - ./data:/app/data
